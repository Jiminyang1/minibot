name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macOS is the target platform; Linux keeps the core portable.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so it is pinned by commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --locked fails when uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      # Unit tests only; they call no model and need no API key.
      - run: uv run python -m unittest discover -s tests
