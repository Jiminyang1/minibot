<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniBot</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1>MiniBot</h1>
      </div>
      <div class="header-right">
        <div class="status" id="status" data-state="idle">idle</div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="toggle theme">dark</button>
      </div>
    </header>

    <main>
      <section class="pane" aria-label="events">
        <div class="pane-title">
          <span>events</span>
          <span class="mono-tag" id="runTag">no run</span>
        </div>
        <div class="feed" id="feed">
          <div class="empty">waiting</div>
        </div>
      </section>

      <section class="pane" aria-label="conversation">
        <div class="pane-title">
          <span>conversation</span>
          <span class="mono-tag" id="sessionTag">current</span>
        </div>
        <div class="conversation" id="conversation">
          <div class="empty">loading</div>
        </div>
      </section>
    </main>

    <form class="composer" id="form">
      <div class="row">
        <select id="sessionSelect" aria-label="session list"></select>
        <input id="session" value="current" aria-label="session id" />
        <button class="small" id="newSession" type="button" title="new session">+ new</button>
        <button class="small" id="renameSession" type="button" title="rename current session">rename</button>
        <button class="small danger" id="deleteSession" type="button" title="delete current session">delete</button>
        <button class="small" id="reloadHistory" type="button" title="reload messages">reload</button>
      </div>
      <div class="composer-inner">
        <textarea id="input" aria-label="message" placeholder="Ask MiniBot · ⌘ / Ctrl + Enter to send"></textarea>
        <button class="composer-action" id="send" type="submit" data-state="send" aria-label="send message" title="Send (⌘/Ctrl + Enter)">
          <svg class="icon-send" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="icon-stop" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
    </form>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
