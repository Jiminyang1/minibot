<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniBot</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1>MiniBot</h1>
      </div>
      <div class="header-right">
        <div class="status" id="status" data-state="idle">idle</div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="toggle theme">dark</button>
      </div>
    </header>

    <main>
      <section class="pane" aria-label="events">
        <div class="pane-title">
          <span>events</span>
          <span class="mono-tag" id="runTag">no run</span>
        </div>
        <div class="feed" id="feed">
          <div class="empty">waiting</div>
        </div>
      </section>

      <section class="pane" aria-label="conversation">
        <div class="pane-title">
          <span>conversation</span>
          <span class="mono-tag" id="sessionTag">current</span>
        </div>
        <div class="conversation" id="conversation">
          <div class="empty">loading</div>
        </div>
      </section>
    </main>

    <form class="composer" id="form">
      <div class="inputs">
        <div class="row">
          <select id="sessionSelect" aria-label="session list"></select>
          <input id="session" value="current" aria-label="session id" />
          <button class="small" id="reloadHistory" type="button">reload</button>
        </div>
        <textarea id="input" aria-label="message" placeholder="Ask MiniBot"></textarea>
      </div>
      <button class="send" id="send" type="submit">send</button>
    </form>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
