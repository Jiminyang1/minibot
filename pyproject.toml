[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minibot"
version = "0.1.0"
description = "Local command-line AI agent with tools, MCP, skills, sessions, and memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "langfuse>=4.16,<5",
    "mcp>=1.27,<2",
    "openai>=1.0",
    "textual>=8.2.8",
    "tiktoken>=0.7",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Not imported by MiniBot; installed so `exec` scripts can analyse artifacts.
data = [
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "tabulate>=0.10.0",
]
# Local embeddings for the lessons loop (retrieval and clustering).
lessons = [
    "fastembed>=0.7",
]

[project.scripts]
minibot = "minibot.__main__:main"
minibot-server = "minibot.server:main"
minibot-daemon = "minibot.scheduler:main"

[tool.setuptools]
packages = [
    "minibot",
    "minibot.evals",
    "minibot.interaction",
    "minibot.lessons",
    "minibot.llm_providers",
    "minibot.mcp_host",
    "minibot.mcp_host.transport",
    "minibot.mcp_servers",
    "minibot.mcp_servers.macos_system",
    "minibot.runtime",
    "minibot.session",
    "minibot.skills",
    "minibot.tools",
    "minibot.tui",
]

[tool.setuptools.package-dir]
"minibot" = "."
"minibot.interaction" = "interaction"
"minibot.lessons" = "lessons"
"minibot.llm_providers" = "llm_providers"
"minibot.mcp_host" = "mcp_host"
"minibot.mcp_host.transport" = "mcp_host/transport"
"minibot.mcp_servers" = "mcp_servers"
"minibot.mcp_servers.macos_system" = "mcp_servers/macos_system"
"minibot.runtime" = "runtime"
"minibot.session" = "session"
"minibot.skills" = "skills"
"minibot.tools" = "tools"
"minibot.tui" = "tui"

[tool.setuptools.package-data]
"minibot" = ["mcp.json", "web/*"]
"minibot.skills" = ["*.md"]
"minibot.evals" = ["*.json"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["examples"]

[tool.ruff.lint]
# Bug-finding rules only: pyflakes, pycodestyle errors, bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# FastAPI's `Body(...)` defaults are the framework idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
# Golden evals call the real model; they are collected only with `-m golden`
# (see evals/test_golden.py). The unit suite runs with unittest from tests/.
markers = [
    "golden: real-model golden evals, opt in with -m golden",
]
